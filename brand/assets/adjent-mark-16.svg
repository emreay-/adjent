<!-- Tray cut: the same drawing on the 16-unit grid, so every edge lands on a whole pixel. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <rect x="1" y="14" width="14" height="2" fill="#12171D">
  </rect>
  <rect x="2" y="0" width="5" height="14" fill="rgba(18,23,29,0.3)">
  </rect>
  <rect x="9" y="0" width="5" height="14" fill="rgba(18,23,29,0.3)">
  </rect>
  <rect x="2" y="3" width="5" height="11" fill="#12171D">
  </rect>
  <rect x="9" y="5" width="5" height="1" fill="#12171D">
  </rect>
</svg>
