name: Release

# Tag-driven, per docs/PACKAGING.md: GitHub Releases is the source of truth and
# every package manager is a mirror of these artefacts. Nothing is ever built
# by hand for one channel.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rehearse; leave empty to build the selected ref. Artifacts only.'
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
            artifacts: |
              packages/desktop/release/*.AppImage
              packages/desktop/release/*.deb
          - os: windows-latest
            platform: --win
            artifacts: |
              packages/desktop/release/*.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Validate workspace and tag versions
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/check-version.mjs
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: node --test scripts/test/*.test.mjs
      - run: node scripts/repo-hygiene.mjs

      # Never ship something that has not passed. A release is the one build
      # where "it probably still works" is not good enough — which is also why
      # the binary smoke test runs here and not only in CI: this is the build
      # whose artifacts reach users.
      - run: pnpm -r test

      - name: Smoke — run the built CLI against a fixture HOME
        run: node packages/cli/test/smoke.mjs

      - name: Smoke — real renderer with synthetic data (Windows)
        if: runner.os == 'Windows'
        run: node scripts/screenshot.mjs

      - name: Smoke — real renderer with synthetic data (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/screenshot.mjs

      # `--publish never`: electron-builder will happily upload on its own when
      # it sees a token and a tag, which would bypass the draft step below and
      # publish before anyone has looked at it.
      - name: Package
        working-directory: packages/desktop
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: adjent-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  draft:
    name: draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Checksums are what a package manifest pins against — Scoop and WinGet
      # both want a SHA256 per file, so publish them with the release rather
      # than making every downstream manifest compute its own.
      - name: Checksum
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Draft, never live: unsigned Windows builds trip SmartScreen, so a human
      # decides when a release is ready to be seen (docs/PACKAGING.md § Signing).
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --draft \
            --prerelease \
            --verify-tag \
            --title "Adjent $TAG" \
            --generate-notes \
            artifacts/*
