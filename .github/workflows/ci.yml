name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms report even when one fails: the interesting case is
      # usually "passes on Linux, fails on Windows", and fail-fast hides it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json — one source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build before typechecking: the desktop and CLI packages typecheck
      # against @adjent/core's *built* declarations, so on a clean checkout
      # `typecheck` alone fails with "has no exported member".
      - run: node scripts/check-version.mjs
      - run: node --test scripts/test/*.test.mjs

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # The steps above prove the modules compile and the units behave. This
      # runs the thing we actually ship: the built CLI, as a process, against a
      # generated fixture home containing synthetic vendor files. A broken entry
      # point, a bad import specifier or a payload that stopped matching
      # docs/API.md passes every step above and fails here.
      - name: Smoke — run the built CLI against a fixture HOME
        run: node packages/cli/test/smoke.mjs

      - name: Verify the public walkthrough against the built CLI
        run: node scripts/demo-discovery.mjs

      - name: Smoke — real renderer with synthetic data (Windows)
        if: runner.os == 'Windows'
        run: node scripts/screenshot.mjs

      - name: Prepare Electron sandbox helper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node -e "require('./packages/desktop/node_modules/electron')"
          adjent_sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require('./packages/desktop/node_modules/electron')), 'chrome-sandbox')")"
          sudo chown root:root "$adjent_sandbox"
          sudo chmod 4755 "$adjent_sandbox"

      - name: Smoke — real renderer with synthetic data (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/screenshot.mjs

  hygiene:
    name: no personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan working files without logging sensitive values
        run: node scripts/repo-hygiene.mjs

      # LF is enforced by .gitattributes; a CRLF file that slips in breaks the
      # renderer tests on one platform only, which is a miserable way to find out.
      - name: Check line endings
        run: |
          set -uo pipefail
          bad=$(git ls-files -z --eol \
            | tr '\0' '\n' \
            | grep -E '^i/crlf' || true)
          if [ -n "$bad" ]; then
            echo "::error::Files committed with CRLF (.gitattributes says LF)."
            echo "$bad"
            exit 1
          fi
          echo "Clean: every tracked text file is LF in the index."
