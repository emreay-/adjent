# Packaging (docs/ARCHITECTURE.md): Windows NSIS + portable, Linux AppImage + deb.
# Unsigned to start; SmartScreen warning documented in the README.
appId: dev.adjent.app
productName: Adjent
directories:
  output: release
files:
  - dist/**
  - package.json
win:
  icon: icons/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  perMachine: false
linux:
  # The scoped workspace name is not a valid Linux executable/package name.
  executableName: adjent
  maintainer: Adjent contributors <6861956+emreay-@users.noreply.github.com>
  icon: icons/icon.png
  target:
    - AppImage
    - deb
  category: Utility
deb:
  packageName: adjent
  # Keep the scoped workspace name out of the output path as well.
  artifactName: adjent-${version}-${arch}.${ext}
