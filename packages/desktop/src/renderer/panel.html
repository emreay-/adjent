<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>Adjent</title>
<style>
  /* Status palette is fixed and never themed (docs/UI.md). */
  :root {
    --bg:#F3F5F7; --surface:#FFFFFF; --line:#D9DFE6; --ink:#12171D; --ink2:#3C4752; --muted:#65727F;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --good-bg:#E4F3E4; --warn-bg:#FBF0D8; --crit-bg:#F7E2E2; --idle:#808890;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0D1116; --surface:#151B22; --line:#2A333D; --ink:#E3E9EF; --ink2:#B4BFCA; --muted:#8593A0;
      --good-bg:#132615; --warn-bg:#2C2411; --crit-bg:#2E1817;
    }
  }
  * { box-sizing:border-box; margin:0; }
  body {
    background:var(--bg); color:var(--ink); font:13px/1.45 "Segoe UI", system-ui, sans-serif;
    height:100vh; display:flex; flex-direction:column; overflow:hidden; user-select:none;
    border:1px solid var(--line);
  }
  header {
    display:flex; justify-content:space-between; align-items:center; padding:9px 14px;
    border-bottom:1px solid var(--line); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); -webkit-app-region:drag;
  }
  header .live { font-variant-numeric:tabular-nums; }
  main { flex:1; overflow-y:auto; }
  section { padding:12px 14px; border-bottom:1px solid var(--line); }

  .chip {
    display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:3px;
    font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  }
  .chip.good { background:var(--good-bg); color:var(--good); }
  .chip.warn { background:var(--warn-bg); color:var(--warn); }
  .chip.crit { background:var(--crit-bg); color:var(--crit); }
  .chip.idle { background:var(--line); color:var(--muted); }

  .heroRow { display:flex; align-items:baseline; gap:8px; margin-top:8px; }
  .hero { font-size:40px; font-weight:600; letter-spacing:-.02em; line-height:1; }
  .rate { font-family:Consolas, monospace; font-size:13px; font-weight:600; color:var(--ink2); }
  .heroMeta { margin-left:auto; text-align:right; font-family:Consolas, monospace; font-size:10.5px; color:var(--muted); line-height:1.5; }

  svg.pace { display:block; width:100%; height:auto; margin-top:8px; overflow:visible; }
  svg.pace text { font-family:Consolas, monospace; font-size:9px; fill:var(--muted); }

  .tokline { display:flex; gap:14px; margin-top:8px; font-family:Consolas, monospace; font-size:10.5px; color:var(--muted); }
  .tokline b { color:var(--ink2); font-weight:500; }

  .row { display:flex; align-items:baseline; gap:8px; padding:3px 0; font-size:12px; }
  .row .dot { width:7px; height:7px; border-radius:50%; flex:none; align-self:center; }
  .row .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .meta { margin-left:auto; font-family:Consolas, monospace; font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .row .meta b { color:var(--ink2); font-weight:600; }

  .alarm { font-size:11.5px; color:var(--ink2); padding:3px 0; }
  .alarm b { font-weight:600; }
  .empty { color:var(--muted); font-size:12px; padding:4px 0; }
  h2 { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:4px; }
</style>
</head>
<body>
  <header><span>Adjent</span><span class="live" id="liveCount"></span></header>
  <main>
    <section id="primary">
      <span class="chip idle" id="verdict">Waiting for data</span>
      <div class="heroRow">
        <span class="hero" id="hero">–</span>
        <span class="rate" id="heroRate"></span>
        <span class="heroMeta" id="heroMeta"></span>
      </div>
      <svg class="pace" id="chart" viewBox="0 0 352 120" aria-label="Utilization against the pace line"></svg>
      <div class="tokline" id="tokline"></div>
    </section>
    <section><h2>Other windows</h2><div id="windows"><div class="empty">–</div></div></section>
    <section><h2>Agents</h2><div id="agents"><div class="empty">–</div></div></section>
    <section><h2>Recent alarms</h2><div id="alarms"><div class="empty">None</div></div></section>
  </main>
  <script src="panel.js"></script>
</body>
</html>
