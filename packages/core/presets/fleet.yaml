# Fleet — four to ten agents running at once.
#
# With one agent, quota is a number you glance at. With eight, it is a resource
# you allocate, and the question stops being "how full is it" and becomes
# "which of these is eating it". So this preset leans on per-agent detection
# and keeps the whole-limit thresholds sparse.
#
# The `anomaly` rule is the one that earns its keep here: with eight agents you
# will not notice one of them quietly repeating itself.

alarms:
  - id: runaway-agent
    type: agent_burn
    window: 5m            # short: a looping subagent should be caught fast
    trigger:
      rel_to_median: 2.5  # tighter than default — with many agents the median
                          # is meaningful, so a smaller multiple is real signal
      share_pct: 40
      abs_pct_per_hour: 5.0
    cooldown: 5m
    severity: warn

  - id: looping-subagent
    type: anomaly
    window: 15m           # long enough for a pattern, short enough to matter
    trigger:
      min_turns: 12       # fewer is a big task, not a loop
      shape_cv: 0.15      # every turn near-identical in size
      growth_floor: 0.2   # and the context has stopped growing
      abs_pct_per_hour: 2.0
    cooldown: 30m
    severity: warn

  - id: pace-any
    type: pace
    scope:
      backend: any
      limit: any
    tolerance_pp: 10
    project_exhaustion_lead: 90m   # more lead: stopping a fleet takes longer
    cooldown: 30m
    severity: warn

  - id: steps-sparse
    type: threshold
    scope:
      backend: any
      limit: any
    levels: [75, 90]
    severity:
      75: warn
      90: critical

routing:
  info: [tray]
  warn: [tray, toast]
  # `webhook` needs settings.alarmWebhookUrl set; without it the sink does not
  # exist and alarms routed here are dropped. Add it once the URL is configured:
  #   critical: [tray, toast, webhook]
  critical: [tray, toast]
